<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE HAUNTED - Jumpscare</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #030303;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  text-align: center;
}

.container {
  padding: 25px;
  width: 100%;
  max-width: 600px;
}

h1 {
  color: #e50914;
  font-size: clamp(35px, 8vw, 65px);
  letter-spacing: 5px;
  text-shadow: 0 0 20px red;
  animation: flicker 2s infinite;
}

p {
  color: #aaa;
  margin: 25px 0;
  line-height: 1.7;
}

button {
  background: #a00000;
  color: white;
  border: 1px solid #ff3333;
  padding: 16px 35px;
  border-radius: 8px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 20px #790000;
  transition: .3s;
}

button:hover {
  background: red;
  transform: scale(1.06);
}

#timer {
  font-size: 80px;
  color: red;
  margin: 25px;
}

#scare {
  position: fixed;
  inset: 0;
  background: #000;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 10;
}

#face {
  font-size: min(65vw, 330px);
  line-height: 1;
  filter: drop-shadow(0 0 25px red);
  animation: shake .07s infinite;
}

#scare h2 {
  color: red;
  font-size: clamp(28px, 8vw, 65px);
  text-shadow: 0 0 25px red;
  margin-top: 25px;
}

#scare small {
  color: #aaa;
  margin-top: 20px;
}

.hidden {
  display: none !important;
}

@keyframes flicker {
  0%, 18%, 22%, 60%, 64%, 100% { opacity: 1; }
  20%, 62% { opacity: .35; }
}

@keyframes shake {
  0% { transform: translate(3px, -3px) scale(1.05); }
  50% { transform: translate(-4px, 3px) scale(1.15); }
  100% { transform: translate(2px, 2px) scale(1.08); }
}

body.flash {
  animation: flash .12s infinite;
}

@keyframes flash {
  0%, 100% { background: #000; }
  50% { background: #650000; }
}
</style>
</head>

<body>

<div class="container" id="main">
  <h1>THE HAUNTED</h1>

  <p>
    ⚠️ PERINGATAN: HORROR EXPERIENCE<br>
    Kamu yakin berani melanjutkan?<br>
    Jangan berpaling dari layar...
  </p>

  <button onclick="startGame()">MULAI JUMPSCARE 👁️</button>

  <div id="timer"></div>
  <p id="message"></p>
</div>

<div id="scare">
  <div id="face">👹</div>
  <h2>MAMPUS KAMU KENA JUMPSCARE!!!</h2>
  <small>Kamu berhasil melewati jumpscare!</small>
  <button onclick="location.reload()" style="margin-top:30px">
    MAIN LAGI
  </button>
</div>

<script>
let audioContext;

function startGame() {
  const button = document.querySelector("#main button");
  button.disabled = true;
  button.classList.add("hidden");

  document.querySelector("#message").textContent =
    "Perhatikan layar... sesuatu sedang mendekat.";

  let count = 5;
  const timer = document.getElementById("timer");
  timer.textContent = count;

  // Audio dimulai setelah interaksi pengguna.
  try {
    audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();
  } catch (error) {
    audioContext = null;
  }

  const countdown = setInterval(() => {
    count--;
    timer.textContent = count > 0 ? count : "";

    if (count <= 0) {
      clearInterval(countdown);
      jumpscare();
    }
  }, 1000);
}

function playHorrorSound() {
  if (!audioContext) return;

  const ctx = audioContext;
  const start = ctx.currentTime;

  // Nada menegangkan yang naik dengan cepat.
  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();

  oscillator.type = "sawtooth";
  oscillator.frequency.setValueAtTime(100, start);
  oscillator.frequency.exponentialRampToValueAtTime(
    1000, start + 0.5
  );
  oscillator.frequency.exponentialRampToValueAtTime(
    180, start + 1.0
  );

  gain.gain.setValueAtTime(0.001, start);
  gain.gain.exponentialRampToValueAtTime(0.3, start + 0.1);
  gain.gain.exponentialRampToValueAtTime(0.001, start + 1.2);

  oscillator.connect(gain);
  gain.connect(ctx.destination);

  oscillator.start(start);
  oscillator.stop(start + 1.2);

  // Bunyi dentuman sintetis.
  const boom = ctx.createOscillator();
  const boomGain = ctx.createGain();

  boom.type = "triangle";
  boom.frequency.setValueAtTime(90, start);
  boom.frequency.exponentialRampToValueAtTime(35, start + 0.4);

  boomGain.gain.setValueAtTime(0.5, start);
  boomGain.gain.exponentialRampToValueAtTime(
    0.001, start + 0.5
  );

  boom.connect(boomGain);
  boomGain.connect(ctx.destination);

  boom.start(start);
  boom.stop(start + 0.5);
}

function jumpscare() {
  const scare = document.getElementById("scare");

  scare.style.display = "flex";
  document.body.classList.add("flash");

  playHorrorSound();

  // Hentikan efek kedip setelah beberapa saat.
  setTimeout(() => {
    document.body.classList.remove("flash");
  }, 1500);
}
</script>

</body>
</html>
